name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running check out of date, so stop it rather than queue behind it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The database schema lives in the backend repo; test against its main branch.
      - uses: actions/checkout@v5
        with:
          repository: MCantuncer/dota2-team-picker
          path: backend
      # Move it out of the workspace so the site's build and lint don't pick up its files.
      - run: mv backend "$RUNNER_TEMP/backend"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0
      - name: Start local Supabase (auth, API, database)
        working-directory: ${{ runner.temp }}/backend/services/accounts
        run: |
          supabase start -x realtime,storage-api,imgproxy,logflare,vector,supavisor,edge-runtime,studio,postgres-meta,mailpit
          # Point the site and tests at the throwaway stack; nothing here reaches a real project.
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "E2E_SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless runs only need Chromium's headless shell, and the runner image already has its system
      # libraries, so skip --with-deps (its apt step was most of this job's time). Cache the browser
      # per Playwright version.
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
