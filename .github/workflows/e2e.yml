name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR makes the running check out of date, so stop it rather than queue behind it. Runs on
# main always finish, so every merge is tested.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The local Supabase stack's fixed URL and public key (the same on every machine, nothing secret), so the
      # site can build before the stack is up. The wait step checks they still match.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # Hero pool cards are behind a flag in production until coverage looks good; tests always see them.
      NEXT_PUBLIC_POOL_CARDS: "on"
    steps:
      - uses: actions/checkout@v7
      # The database schema lives in the backend repo. Test against the commit the site's copies are pinned to.
      - id: backend
        run: echo "ref=$(cat backend-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: MCantuncer/dota2-team-picker
          ref: ${{ steps.backend.outputs.ref }}
          path: backend
      # Move it out of the workspace so the site's build and lint don't pick up its files.
      - run: mv backend "$RUNNER_TEMP/backend"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      # Starting Supabase (mostly pulling its Docker images) is the slowest step, so run it in the background
      # while the site installs and builds, and wait for it just before the tests.
      - name: Start local Supabase in the background
        working-directory: ${{ runner.temp }}/backend/services/accounts
        run: |
          date +%s > "$RUNNER_TEMP/supabase.started"
          (
            if supabase start -x realtime,storage-api,imgproxy,logflare,vector,supavisor,edge-runtime,studio,postgres-meta,mailpit
            then status=0; else status=1; fi
            date +%s > "$RUNNER_TEMP/supabase.ended"
            echo "$status" > "$RUNNER_TEMP/supabase.exit"
          ) > "$RUNNER_TEMP/supabase.log" 2>&1 &
      - uses: ./.github/actions/install
      # Headless runs only need Chromium's headless shell, and the runner image already has its system
      # libraries, so skip --with-deps (its apt step was most of this job's time). Cache the browser
      # per Playwright version.
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run build
      - name: Wait for local Supabase
        working-directory: ${{ runner.temp }}/backend/services/accounts
        run: |
          waited=$(date +%s)
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/supabase.exit" ]; do sleep 2; done'
          cat "$RUNNER_TEMP/supabase.log"
          started=$(cat "$RUNNER_TEMP/supabase.started") ended=$(cat "$RUNNER_TEMP/supabase.ended")
          echo "::notice::Supabase took $((ended - started))s to start; the tests waited $(($(date +%s) - waited))s for it."
          [ "$(cat "$RUNNER_TEMP/supabase.exit")" = 0 ]
          eval "$(supabase status -o env)"
          # The build already used the local stack's well-known URL and publishable key; make sure they match.
          [ "$API_URL" = "$NEXT_PUBLIC_SUPABASE_URL" ] && [ "$PUBLISHABLE_KEY" = "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]
          echo "E2E_SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
